name: etl
on:
  schedule:
    - cron: "*/5 * * * *"     # GitHub's minimum; the agent loops once a minute inside the job
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: etl
  cancel-in-progress: false
jobs:
  etl:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python -m src.agent --iterations 5 --interval 60
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          JEV_API_KEY: ${{ secrets.JEV_API_KEY }}
          JEV_API_URL: ${{ secrets.JEV_API_URL }}
      - run: python scripts/bingo_check.py . || true
      - name: Commit results
        run: |
          git config user.name "etl-bot"
          git config user.email "etl-bot@users.noreply.github.com"
          git add db data BINGO.md bingo.html
          git commit -m "etl: $(date -u +%FT%TZ)" || exit 0
          git pull --rebase && git push
